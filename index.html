<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura na Floresta Encantada</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#cenario{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(#6fd3ff,#b9ecff 60%,#6fd96f);
    overflow:hidden;
}

/* Sol */
#sol{
    position:absolute;
    top:40px;
    right:60px;
    width:90px;
    height:90px;
    background:#FFD93D;
    border-radius:50%;
    box-shadow:0 0 50px gold;
}

/* Nuvens */
.nuvem{
    position:absolute;
    width:150px;
    height:50px;
    background:white;
    border-radius:50px;
    opacity:.9;
    animation:nuvens 25s linear infinite;
}

.nuvem::before,
.nuvem::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.nuvem::before{
    width:60px;
    height:60px;
    left:20px;
    top:-25px;
}

.nuvem::after{
    width:70px;
    height:70px;
    right:20px;
    top:-30px;
}

@keyframes nuvens{
    from{transform:translateX(-250px);}
    to{transform:translateX(120vw);}
}

/* Montanhas */
.montanha{
    position:absolute;
    bottom:180px;
    width:0;
    height:0;
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:280px solid #5a6d7c;
}

/* Rio */
#rio{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#3bb9ff;
}

/* Gramado */
#grama{
    position:absolute;
    bottom:120px;
    width:100%;
    height:80px;
    background:#49b84a;
}

/* Árvores */
.arvore{
    position:absolute;
    bottom:170px;
}

.tronco{
    width:20px;
    height:70px;
    background:#7b4b22;
    margin:auto;
}

.copa{
    width:80px;
    height:80px;
    background:#1ea43a;
    border-radius:50%;
    margin-left:-30px;
    box-shadow:
        -20px 20px #27c346,
        20px 20px #27c346;
}

/* Flores */
.flor{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
}

/* Personagem */
#heroi{
    position:absolute;
    width:40px;
    height:60px;
    background:#ff4444;
    border-radius:10px;
    left:120px;
    bottom:190px;
    transition:.05s;
}

/* Animais */
.coelho{
    position:absolute;
    bottom:190px;
    width:35px;
    height:25px;
    background:white;
    border-radius:50%;
    animation:pular 1s infinite alternate;
}

@keyframes pular{
    from{transform:translateY(0);}
    to{transform:translateY(-20px);}
}

.passaro{
    position:absolute;
    font-size:30px;
    animation:voar 12s linear infinite;
}

@keyframes voar{
    from{
        left:-100px;
        top:80px;
    }
    to{
        left:110%;
        top:130px;
    }
}
</style>
</head>

<body>

<div id="cenario">

<div id="sol"></div>

<div class="nuvem" style="top:70px;"></div>
<div class="nuvem" style="top:150px;animation-duration:35s;"></div>

<div class="montanha" style="left:20px;"></div>
<div class="montanha" style="left:300px;"></div>
<div class="montanha" style="left:650px;"></div>

<div id="grama"></div>
<div id="rio"></div>

<div class="arvore" style="left:120px;">
<div class="copa"></div>
<div class="tronco"></div>
</div>

<div class="arvore" style="left:350px;">
<div class="copa"></div>
<div class="tronco"></div>
</div>

<div class="arvore" style="left:650px;">
<div class="copa"></div>
<div class="tronco"></div>
</div>

<div id="heroi"></div>

<div class="coelho" style="left:520px;"></div>

<div class="passaro">🦅</div>

</div>

<script>
// Criar flores automaticamente
const cenario = document.getElementById("cenario");

for(let i=0;i<70;i++){

    let flor=document.createElement("div");
    flor.className="flor";

    const cores=["red","yellow","pink","white","purple","orange"];

    flor.style.background=
        cores[Math.floor(Math.random()*cores.length)];

    flor.style.left=Math.random()*window.innerWidth+"px";
    flor.style.bottom=(130+Math.random()*60)+"px";

    cenario.appendChild(flor);
}

// Movimento do herói
const heroi=document.getElementById("heroi");

let x=120;
let y=190;
const vel=10;

document.addEventListener("keydown",(e)=>{

if(e.key=="ArrowRight"||e.key=="d") x+=vel;
if(e.key=="ArrowLeft"||e.key=="a") x-=vel;
if(e.key=="ArrowUp"||e.key=="w") y+=vel;
if(e.key=="ArrowDown"||e.key=="s") y-=vel;

x=Math.max(0,Math.min(window.innerWidth-40,x));
y=Math.max(160,Math.min(window.innerHeight-60,y));

heroi.style.left=x+"px";
heroi.style.bottom=y+"px";

});

// Borboletas
for(let i=0;i<8;i++){

let b=document.createElement("div");
b.innerHTML="🦋";
b.style.position="absolute";
b.style.fontSize="24px";
b.style.left=Math.random()*window.innerWidth+"px";
b.style.top=Math.random()*250+"px";

b.animate([
{transform:"translateY(0px)"},
{transform:"translateY(-30px)"},
{transform:"translateY(20px)"},
{transform:"translateY(0px)"}
],
{
duration:2000+Math.random()*3000,
iterations:Infinity
});

cenario.appendChild(b);

}
</script>

</body>
</html>
